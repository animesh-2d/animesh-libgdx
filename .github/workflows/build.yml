name: build

# Builds the library, then the player on top of it:
#   * library  — compile, test, jar/sources/javadoc  (Linux)
#   * player   — compile, test, jpackage app-image   (Windows, needs the library job)
# A `v*` tag additionally publishes com.jb.rts:animesh-lib to GitHub Packages
# and creates a public GitHub Release with the zipped Windows player and library JARs.
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  library:
    name: Library (jar + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test the library
        run: ./gradlew :animesh-lib:build --stacktrace

      - name: Upload the library jar
        uses: actions/upload-artifact@v4
        with:
          name: animesh-lib-jars
          path: animesh-lib/build/libs/*.jar
          if-no-files-found: error

  player:
    name: Player (app-image)
    needs: library
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test the player
        run: ./gradlew :player:build --stacktrace

      - name: Build the standalone player (jpackage)
        run: ./gradlew :player:jpackageImage --stacktrace

      - name: Upload the standalone player
        uses: actions/upload-artifact@v4
        with:
          name: AnimeshPlayer-windows
          path: player/build/jpackage/AnimeshPlayer
          if-no-files-found: error

  publish:
    name: Publish the library (tags only)
    needs: library
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Publish to GitHub Packages
        run: ./gradlew :animesh-lib:publish --stacktrace
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release:
    name: Create GitHub Release (tags only)
    needs: [ library, player ]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download library jars
        uses: actions/download-artifact@v4
        with:
          name: animesh-lib-jars
          path: release-assets

      - name: Download Windows player
        uses: actions/download-artifact@v4
        with:
          name: AnimeshPlayer-windows
          path: player-temp/AnimeshPlayer

      - name: Zip Windows player
        run: |
          cd player-temp
          zip -r ../release-assets/AnimeshPlayer-windows.zip AnimeshPlayer

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*
